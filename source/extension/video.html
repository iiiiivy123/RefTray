<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>灵感采集 · 本地视频抽帧</title>
<link rel="stylesheet" href="tool-page.css">
<header class="tool-header"><h1>本地视频抽帧</h1><select id="ui-language" aria-label="Language / 语言"><option value="zh">中文</option><option value="en">English</option></select></header>
<p class="tool-intro">从本地视频保存画面，保留原视频。</p>
<section class="tool-form">
  <div class="tool-field"><label for="file">选择视频</label><input id="file" type="file" accept="video/*"></div>
  <video id="video" controls preload="auto"></video>
  <div class="tool-options">
    <label>取图方式 <select id="strategy"><option value="slides">合并相近画面</option><option value="interval">按固定间隔取图</option></select></label>
    <label>间隔 <input id="interval" type="number" min="0.5" max="60" step="0.5" value="1"> 秒</label>
  </div>
  <p class="tool-note">每次最多 600 个采样点，图片最长边 2560 像素。减小间隔可保留更多短暂画面。</p>
  <div class="tool-actions"><button id="start" class="primary" disabled>开始抽帧</button><button id="pause" disabled>暂停</button><button id="stop" disabled>停止</button></div>
  <progress id="progress" max="100" value="0"></progress>
  <p id="status" role="status">请选择本地视频。</p>
  <details><summary>结果详情</summary><pre id="diagnostic-text"></pre></details>
</section>
<script src="frame-engine.js"></script>
<script src="health-client.js"></script><script src="hub-api.js"></script>
<script src="i18n.js"></script>
<script src="video-content.js"></script>
<script src="video.js"></script>
</html>
